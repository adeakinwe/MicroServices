syntax = "proto3";

option csharp_namespace = "CustomerService";

service GrpcCustomerService {
    rpc GetAllCustomers (GetAllRequest) returns (CustomerResponse);
}

message GetAllRequest {}

message GrpcCustomerModel {
    int32 customerId = 1;
    string customerCode = 2;
    string publisher = 3;
}

message CustomerResponse {
    repeated GrpcCustomerModel platform = 1;
}